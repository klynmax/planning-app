<main class="content">
  <div class="card">
    <h2>Novo Cartão</h2>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="form">
      <div class="form-group">
        <label for="name">Nome do cartão: </label>
        <input formControlName="name" type="text" id="name" name="name" placeholder="Meu cartão" />
      </div>
      <div class="form-group">
        <label for="name">Bandeira: </label>
        <select formControlName="brand">
          <option value="" >Selecione...</option>
          <option value="AMERICAN_EXPRESS">American Express</option>
          <option value="DINERS">Dinners</option>
          <option value="ELO">Elo</option>
          <option value="HIPERCARD">Hipercard</option>
          <option value="MASTERCARD">Mastercard</option>
          <option value="VISA">Visa</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Salvar</button>
        <button type="button" class="btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>
</main>
