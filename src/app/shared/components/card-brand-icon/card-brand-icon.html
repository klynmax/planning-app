@switch (normalizedBrand) {

  @case ('VISA') {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visa">
      <rect width="48" height="32" rx="4" fill="#1A1F71"/>
      <text x="24" y="21" text-anchor="middle"
            font-family="Arial, sans-serif" font-weight="bold" font-style="italic"
            font-size="13" fill="#FFFFFF" letter-spacing="0.5">VISA</text>
    </svg>
  }

  @case ('MASTERCARD') {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mastercard">
      <rect width="48" height="32" rx="4" fill="#FFFFFF"/>
      <circle cx="19" cy="16" r="9" fill="#EB001B"/>
      <circle cx="29" cy="16" r="9" fill="#F79E1B"/>
      <path d="M24 8.6a9 9 0 0 0 0 14.8 9 9 0 0 0 0-14.8z" fill="#FF5F00"/>
    </svg>
  }

  @case ('AMERICAN_EXPRESS') {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="American Express">
      <rect width="48" height="32" rx="4" fill="#006FCF"/>
      <text x="24" y="20" text-anchor="middle"
            font-family="Arial, sans-serif" font-weight="bold"
            font-size="10" fill="#FFFFFF" letter-spacing="0.3">AMEX</text>
    </svg>
  }

  @case ('DINERS') {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diners Club">
      <rect width="48" height="32" rx="4" fill="#FFFFFF"/>
      <circle cx="24" cy="16" r="10" fill="#0079BE"/>
      <circle cx="24" cy="16" r="10" fill="none" stroke="#0079BE" stroke-width="0"/>
      <path d="M22 9.5v13a7 7 0 0 1 0-13z" fill="#FFFFFF"/>
      <path d="M26 9.5a7 7 0 0 1 0 13z" fill="#FFFFFF"/>
    </svg>
  }

  @case ('ELO') {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elo">
      <rect width="48" height="32" rx="4" fill="#000000"/>
      <circle cx="15" cy="16" r="5" fill="#FFCB05"/>
      <circle cx="24" cy="16" r="5" fill="#EF4123"/>
      <circle cx="33" cy="16" r="5" fill="#00A4E0"/>
      <text x="24" y="28" text-anchor="middle"
            font-family="Arial, sans-serif" font-weight="bold"
            font-size="6" fill="#FFFFFF" letter-spacing="0.5">elo</text>
    </svg>
  }

  @case ('HIPERCARD') {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hipercard">
      <rect width="48" height="32" rx="4" fill="#B3131B"/>
      <text x="24" y="18" text-anchor="middle"
            font-family="Arial, sans-serif" font-weight="bold" font-style="italic"
            font-size="9" fill="#FFFFFF">Hiper</text>
      <text x="24" y="26" text-anchor="middle"
            font-family="Arial, sans-serif" font-weight="bold" font-style="italic"
            font-size="6" fill="#FFFFFF">card</text>
    </svg>
  }

  @default {
    <svg class="brand-svg" [attr.width]="width" [attr.height]="height"
         viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartão">
      <rect width="48" height="32" rx="4" fill="#E5E7EB"/>
      <rect x="6" y="10" width="36" height="4" fill="#9CA3AF"/>
      <rect x="6" y="20" width="12" height="4" fill="#9CA3AF"/>
    </svg>
  }

}
