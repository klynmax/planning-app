<div class="app-container">
   <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fa-solid fa-wallet"></i>
      <span>{{ APP_NAME }}</span>
    </div>

    <nav class="sidebar-menu">
      <a class="menu-item active" [routerLink]="['/dashboard']">
        <i class="fa-solid fa-chart-line"></i>
        <span>{{ DASHBOARD }}</span>
      </a>
      <a class="menu-item" [routerLink]="['/cards-listing']">
        <i class="fa-solid fa-credit-card"></i>
        <span>{{ CREDIT_CARDS }}</span>
      </a>
      <a class="menu-item" [routerLink]="['/category-listing']">
        <i class="fa-solid fa-tags"></i>
        <span>{{ CATEGORIES }}</span>
      </a>
      <a class="menu-item" [routerLink]="['/release-listing']">
        <i class="fa-solid fa-receipt"></i>
        <span>{{ NEW_RELEASES }}</span>
      </a>
    </nav>
     <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <button type="button" class="menu-item logout-button" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>{{ EXIT }}</span>
      </button>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <div class="main-content">
    <!-- Header -->
     <app-header></app-header>
    <router-outlet></router-outlet>
  </div>
</div>
